name: Judge certification (live)

# NO CALLERS TODAY. This is workflow_call-only, so it never fires on its own —
# it is kept as the one definition of what certifying the judge means, so that
# restoring the gate is adding a caller rather than rewriting this from memory.
# It needs an ANTHROPIC_API_KEY repository secret, which this project does not
# keep; the release workflow no longer depends on it. The scenarios still run on
# every push against a recorded judge (test/judge-evals.test.js), and
# `node scripts/ci/run-live-evals.mjs` grades a live model on demand.
on:
  workflow_call:
    inputs:
      reason:
        description: why this certification is running
        type: string
        required: false
        default: certification
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  certify:
    name: certify the judge (${{ inputs.reason }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: install the agent CLI the judge runs
        run: npm install -g @anthropic-ai/claude-code

      # Every scenario in the suite, read from the suite itself — never a
      # hardcoded count, so scenarios added later are certified the day they
      # land and any public "N of N" stays true by construction.
      - name: run certification scenarios
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/ci/run-live-evals.mjs --concurrency 4
