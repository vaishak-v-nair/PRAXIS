name: Release

# A trust product whose own releases are hand-rolled from a laptop is
# self-refuting. Provenance can only be minted from CI, so this workflow IS the
# release ritual: write the changelog entry, push a v-tag, approve the
# environment, npm publishes with a provenance attestation. No long-lived npm
# token exists anywhere.
#
#   1. CHANGELOG.md: rename [Unreleased] to [0.10.0] — YYYY-MM-DD, commit
#   2. git tag v0.10.0 && git push origin v0.10.0
#
# Step 1 is not optional: the changelog job refuses a tag the file does not
# name, before the approval gate — the fleet auto-upgrades, and this file is
# the only notice it gets.
#
# One-time setup on npmjs.com (trusted publisher). All four values must match
# this file EXACTLY or publish fails with a bare 404:
#   organization/user : vaishak-v-nair
#   repository        : PRAXIS
#   workflow filename : release.yml
#   environment name  : release
#
# Every job is guarded on the repository name, and this workflow is the reason
# the guard is not optional: the confidential mirror receives this file through
# a branch merge, so a v-tag pushed there would otherwise try to publish
# praxis-memory from a repository the npm trusted publisher does not recognise.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Fails in seconds if CHANGELOG.md does not name the tagged version, so a
  # human is never asked to approve a release that cannot finish. The file is
  # the source of truth: the GitHub Release body is extracted from it below,
  # which is what keeps the repo file and the release page from drifting apart.
  changelog:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: the changelog names this release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/ci/changelog.mjs notes "$GITHUB_REF_NAME"

  test:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: test · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  pack-smoke:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: pack + install + launch · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/ci/pack-smoke.mjs

  # Live judge certification used to gate this step. It needs an ANTHROPIC_API_KEY
  # repository secret to run the shipped judge for real, and this project does not
  # keep one — so the gate was removed rather than left to fail, or worse, faked
  # against a model nobody ships. The suite itself is intact: the same seven
  # iron-rule scenarios run in CI on every push against a recorded judge
  # (test/judge-evals.test.js), and `node scripts/ci/run-live-evals.mjs` grades a
  # live model on demand. To restore the gate, add the secret and re-add a job
  # calling .github/workflows/live-evals.yml with publish depending on it.

  publish:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: publish to npm (provenance)
    needs: [test, pack-smoke, changelog]
    runs-on: ubuntu-latest
    # The human control point. Everything above is machine-verified; this is
    # the one place a person says "ship it."
    environment: release
    permissions:
      contents: write # to create the GitHub Release
      id-token: write # to mint the provenance attestation via OIDC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Runner npm can lag; trusted publishing needs >= 11.5.1.
      - name: ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: the tag must match the version being published
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "publishing $PKG"

      # No --provenance flag: OIDC trusted publishing mints the attestation
      # automatically, and passing the flag with a token-less setup fails.
      - name: npm publish
        run: npm publish

      # The release body is CHANGELOG.md's entry for this version — written by
      # a person, gated above, never typed into a web form after the fact. The
      # auto-generated commit list is appended underneath as the paper trail.
      # This page is where support changes and deprecation reasons reach a
      # fleet that auto-upgrades.
      - name: create the GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/ci/changelog.mjs notes "$GITHUB_REF_NAME" > .release-notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
            --notes-file .release-notes.md --generate-notes
