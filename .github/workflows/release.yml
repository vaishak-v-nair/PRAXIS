name: Manual npm release

# Only a maintainer dispatch can publish. A pushed tag alone does nothing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing reviewed tag matching package.json (for example v0.14.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  metadata:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: reviewed tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const tag = process.env.RELEASE_TAG; const pkg = JSON.parse(fs.readFileSync('package.json')); if (!/^v[0-9]+\.[0-9]+\.[0-9]+$/.test(tag) || tag !== 'v' + pkg.version) process.exit(1);"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"
      - run: npm run release:metadata
      - run: node scripts/ci/leak-guard.mjs

  test:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/ci/run-tests.mjs

  pack-smoke:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/ci/pack-smoke.mjs

  verify-golden:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run eval:verify
        env:
          PROMPTFOO_DISABLE_TELEMETRY: '1'

  workbench:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --prefix apps/workbench --ignore-scripts
      - run: python -m venv apps/workbench/.venv
      - run: apps/workbench/.venv/bin/python -m pip install -r apps/workbench/backend/requirements.txt
      - run: apps/workbench/.venv/bin/python -m pip check
      - run: npm run test:workbench
      - run: npm run typecheck:workbench
      - run: npm run build:workbench
      - run: npm --prefix apps/workbench audit --omit=dev --audit-level=high

  publish:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    needs: [metadata, test, pack-smoke, verify-golden, workbench]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: prepare gate tooling without application lifecycle scripts
        run: |
          npm install -g npm@11
          npm ci --ignore-scripts
          npm ci --prefix apps/workbench --ignore-scripts
          python -m venv apps/workbench/.venv
          apps/workbench/.venv/bin/python -m pip install -r apps/workbench/backend/requirements.txt
      # Trusted publisher must match vaishak-v-nair / PRAXIS / release.yml / release.
      # No stored npm token. prepublishOnly repeats the local gate before upload.
      - run: npm publish
      - name: create GitHub release from the reviewed changelog
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/ci/changelog.mjs notes "$RELEASE_TAG" > .release-notes.md
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file .release-notes.md --generate-notes
