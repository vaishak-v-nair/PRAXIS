name: Workbench quality

on:
  push:
    branches: [main]
    paths: ['apps/workbench/**', 'src/commands/workbench.js', 'src/lib/workbench.js', 'test/workbench.test.js', '.github/workflows/workbench.yml']
  pull_request:
    paths: ['apps/workbench/**', 'src/commands/workbench.js', 'src/lib/workbench.js', 'test/workbench.test.js', '.github/workflows/workbench.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/workbench/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high
  api:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/workbench
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pip check
      - run: python -B -m unittest discover -s backend/tests -v
        env:
          PYTHONPATH: backend
