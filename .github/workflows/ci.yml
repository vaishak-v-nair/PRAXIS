name: CI

# The winning claim is trust. An untested matrix is an untrusted matrix, so
# everything public waits on this being green (launch gate, condition 1).
#
# Every job is guarded on the repository name. The confidential mirror
# (PRAXIS-pvt) receives this file through a branch merge, and without the guard
# it runs the whole matrix there too — burning metered private Actions minutes
# and reporting red for secrets that only exist on the public repo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: test · ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Exactly the line package.json advertises in "engines" (>=22):
        # 22 = Maintenance LTS, 24 = Active LTS, 26 = Current (LTS Oct 2026).
        # Support is advertised only where CI exercises it.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # No install step: PRAXIS has zero runtime dependencies, and the test
      # suite needs none either. If this ever needs `npm ci`, something was
      # added that should not have been.
      #
      # Run through the reporter rather than `npm test` directly: it streams the
      # same output but also emits an annotation naming each failing test, so a
      # red run explains itself instead of saying "exit code 1".
      - name: npm test
        run: node scripts/ci/run-tests.mjs

  leak-guard:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: nothing private is tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The personal Obsidian vault lives inside this working tree, and the only
      # thing keeping it out of the repo is a .gitignore pattern — which has
      # already failed twice, both times on a rename. A filter can only fail
      # open. This asks the checkable question instead: is anything we KNOW is
      # private in the index right now? Runs first and finishes in seconds,
      # because the one failure here is the one that cannot be undone.
      - name: leak guard
        run: node scripts/ci/leak-guard.mjs

  coverage-floor:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: coverage does not go backwards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Coverage was never measured here, so it could only drift one way with
      # nobody the wiser — and it had: fifteen commands sat at 0% FUNCTION
      # coverage while the libraries under them were at 90-100%. This is a
      # floor, not a target. Raising it is a deliberate commit
      # (`node scripts/ci/coverage-floor.mjs --update`); lowering it quietly is
      # the thing it exists to prevent.
      - name: coverage floor
        run: node scripts/ci/coverage-floor.mjs

  judge-fixture:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: judge scorecard discriminates (zero tokens)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # The scorecard is only worth something if it can tell a real judge from a
      # rubber stamp. The canned stub must FAIL certification — if it ever
      # passes, the eval suite has stopped measuring anything.
      - name: canned stub judge must not pass certification
        env:
          PRAXIS_JUDGE_CMD: '["node","test/fixtures/judge-fixture.mjs"]'
        run: |
          if node test/fixtures/eval-run.mjs; then
            echo "::error::the stub judge PASSED certification — the eval suite no longer discriminates"
            exit 1
          else
            echo "stub judge failed certification, as it must"
          fi

  tray-macos:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: macOS tray host compiles and reports
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The macOS tray was written on a Windows machine with no Mac to run it
      # on. These steps are the substitute: they cannot prove the axolotl
      # appears in the menu bar — a CI runner has no GUI session — but they
      # catch every failure that killed it before it ever drew a pixel.

      # 1. Does the JXA host even parse? osacompile compiles WITHOUT running,
      #    which is the whole point: running it would try to claim a status bar
      #    item on a machine with no menu bar and hang the job.
      - name: the JXA host compiles
        run: |
          osacompile -l JavaScript -o /tmp/praxis-tray.scpt src/tray/tray-mac.js
          echo "compiled: $(ls -la /tmp/praxis-tray.scpt | awk '{print $5}') bytes"

      # 2. Does the ObjC bridge the host depends on actually load here?
      - name: the ObjC bridge reaches AppKit
        run: |
          out=$(osascript -l JavaScript -e 'ObjC.import("Cocoa"); ObjC.import("stdlib"); $.NSStatusBar ? "bridge-ok" : "bridge-missing"')
          echo "$out"
          [ "$out" = "bridge-ok" ] || { echo "::error::the Cocoa bridge did not load — the tray host cannot work here"; exit 1; }

      # 3. The state bridge is the one piece the host runs on every poll. If
      #    this prints anything but parseable JSON, the menu bar shows nothing.
      - name: the state bridge prints JSON on macOS
        run: |
          mkdir -p /tmp/praxis-proj/.praxis
          printf '# Memory\n### 2026-07-30T09:05:00.000Z - a decision\n' > /tmp/praxis-proj/.praxis/memory.md
          node src/tray/tray-state.mjs /tmp/praxis-proj "$PWD/src/lib" > /tmp/state.json
          cat /tmp/state.json
          node -e "
            const s = JSON.parse(require('fs').readFileSync('/tmp/state.json','utf8'));
            const need = ['name','label','kb','capKb','entries','recent','project'];
            for (const k of need) if (!(k in s)) { console.error('::error::state is missing ' + k); process.exit(1); }
            if (s.entries !== 1) { console.error('::error::expected 1 entry, got ' + s.entries); process.exit(1); }
            console.log('state bridge ok:', s.name, '/', s.label);
          "

      # 4. The darwin branch of the tray command, end to end, minus AppKit.
      - name: praxis tray --once runs the darwin path
        run: |
          cd /tmp/praxis-proj
          out=$(node "$GITHUB_WORKSPACE/src/cli.js" tray --once)
          echo "$out"
          case "$out" in
            state=*) echo "darwin --once ok" ;;
            *) echo "::error::tray --once did not report a state on macOS"; exit 1 ;;
          esac

      # 5. Every emotion the host can ask for must exist as a menu bar icon,
      #    at both glow intensities. A missing PNG is an invisible tray.
      - name: every state has a menu bar icon
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { TRAY_STATES } from './src/lib/tray-state.js';
            let bad = 0;
            for (const s of TRAY_STATES) for (const suf of ['', '2']) {
              const f = 'src/tray/icons-mac/' + s + suf + '.png';
              if (!fs.existsSync(f)) { console.error('::error::missing ' + f); bad++; continue; }
              if (fs.readFileSync(f).slice(1, 4).toString() !== 'PNG') { console.error('::error::not a PNG: ' + f); bad++; }
            }
            if (bad) process.exit(1);
            console.log(TRAY_STATES.length * 2 + ' menu bar icons present and valid');
          "

  tray-windows:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: Windows tray host parses and reports
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # The macOS tray — which there is no Mac here to run — had five CI gates.
      # The Windows tray, which is the one that actually ships to users today,
      # had none: a syntax error in 845 lines of PowerShell passed every test
      # and published, and the first person to find out was somebody whose
      # axolotl silently never appeared. Every check below is a failure this
      # file has actually had.

      # 1. Does it parse? ParseFile reports syntax errors WITHOUT executing —
      #    the same trick osacompile plays for the macOS host. Deliberately
      #    Windows PowerShell 5.1, because that is the interpreter tray.js
      #    launches, not pwsh 7.
      - name: the host parses under Windows PowerShell 5.1
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD\src\tray\tray.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            foreach ($e in $errors) {
              Write-Host "::error file=src/tray/tray.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)"
            }
            exit 1
          }
          Write-Host "tray.ps1 parses clean ($((Get-Content src\tray\tray.ps1).Count) lines)"

      # 2. Pure ASCII. PowerShell 5.1 reads a file with no BOM as ANSI, so a
      #    stray em dash becomes mojibake in a tooltip somebody reads every day.
      #    Four had already crept into comments before this check existed.
      - name: the host is pure ASCII
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("$PWD\src\tray\tray.ps1")
          $bad = @($bytes | Where-Object { $_ -gt 127 })
          if ($bad.Count -gt 0) {
            Write-Host "::error file=src/tray/tray.ps1::$($bad.Count) non-ASCII bytes - PS 5.1 decodes these as ANSI"
            exit 1
          }
          Write-Host "pure ASCII ($($bytes.Count) bytes)"

      # 3. Static analysis, errors only. Warnings are style; an Error is a bug.
      - name: PSScriptAnalyzer finds no errors
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck | Out-Null
          }
          Import-Module PSScriptAnalyzer
          $found = Invoke-ScriptAnalyzer -Path src\tray\tray.ps1 -Severity Error
          if ($found) {
            $found | ForEach-Object {
              Write-Host "::error file=src/tray/tray.ps1,line=$($_.Line)::$($_.RuleName): $($_.Message)"
            }
            exit 1
          }
          Write-Host "no analyzer errors"

      # 4. The whole win32 branch of the tray command, headless. `--once`
      #    computes the state in the foreground and prints it — no WinForms
      #    window, so it runs on a machine with no interactive desktop.
      - name: praxis tray --once reports a state
        shell: bash
        run: |
          mkdir -p /tmp/praxis-proj/.praxis
          printf '# Memory\n### 2026-07-30T09:05:00.000Z - a decision\n' > /tmp/praxis-proj/.praxis/memory.md
          printf '{"tray":true}' > /tmp/praxis-proj/.praxis/config.json
          cd /tmp/praxis-proj
          out=$(node "$GITHUB_WORKSPACE/src/cli.js" tray --once)
          echo "$out"
          case "$out" in
            *state=*) echo "win32 --once ok" ;;
            *) echo "::error::tray --once did not report a state on Windows"; exit 1 ;;
          esac

      # 5. Every state the host can ask for must exist as an .ico at both glow
      #    intensities. A missing icon is an invisible tray with no error.
      - name: every state has a tray icon
        shell: bash
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            import { TRAY_STATES } from './src/lib/tray-state.js';
            let bad = 0;
            for (const s of TRAY_STATES) for (const suf of ['', '2']) {
              const f = 'src/tray/icons/' + s + suf + '.ico';
              if (!fs.existsSync(f)) { console.error('::error::missing ' + f); bad++; continue; }
              const b = fs.readFileSync(f);
              if (b[0] !== 0 || b[1] !== 0 || b[2] !== 1) { console.error('::error::not an ICO: ' + f); bad++; }
            }
            if (bad) process.exit(1);
            console.log(TRAY_STATES.length * 2 + ' tray icons present and valid');
          "

  pack-smoke:
    if: github.repository == 'vaishak-v-nair/PRAXIS'
    name: pack + install + launch · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Packs the real tarball, installs it into an empty directory, runs it,
      # and enforces the unpacked-size budget. This is the only job that tests
      # what actually ships rather than the working tree.
      - name: pack smoke
        run: node scripts/ci/pack-smoke.mjs
